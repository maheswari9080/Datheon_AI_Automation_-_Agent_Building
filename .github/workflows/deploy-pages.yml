name: Deploy NEXUS Flow AI to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Test & Build Static Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite (27 Engine & Security Tests)
        run: |
          python -m pytest -v

      - name: Assemble GitHub Pages Static Site
        run: |
          mkdir -p _site
          # Copy main application entrypoint
          cp nexus_flow/static/index.html _site/index.html
          # Copy static CSS & JS
          mkdir -p _site/static
          cp -r nexus_flow/static/css _site/static/
          cp -r nexus_flow/static/js _site/static/
          # Copy visual assets and infographics
          if [ -d "assets" ]; then
            cp -r assets _site/
          fi
          # Copy documentation
          if [ -d "docs" ]; then
            cp -r docs _site/
          fi
          # Copy Single Page App fallback
          cp _site/index.html _site/404.html
          # Prevent Jekyll processing
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
